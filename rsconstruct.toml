# rsconstruct build configuration for this repository.

[analyzer.python]

[processor.ruff]
src_dirs = ["scripts"]

[processor.pylint]
src_dirs = ["scripts"]

[processor.mypy]
src_dirs = ["scripts"]

[processor.taplo]
src_dirs = ["."]

[processor.iyamllint]
src_dirs = ["yaml"]

# ─── repo-specific configuration ────────────────────────────────────────────

# The Makefile converted each yaml/**/*.yaml to out/**/*.json with `yq < in > out`
# (the Python yq, which defaults to JSON output). The generator processor drives
# scripts/yaml_to_json.py, which does the same stdin->stdout redirect since yq
# takes no output-path argument.
[processor.generator.yaml_json]
command = "scripts/yaml_to_json.py"
src_dirs = ["yaml"]
src_extensions = [".yaml"]
output_dir = "out"
output_extension = "json"
batch = false

# The Python yq (a jq wrapper) so CI can run the conversion.

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
