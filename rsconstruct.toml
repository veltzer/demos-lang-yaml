# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts"]

[processor.pylint]
src_dirs = ["scripts"]

[processor.mypy]
src_dirs = ["scripts"]

[processor.requirements]
src_dirs = ["scripts"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts"]
args = ["--severity=error", "--shell=bash"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.iyamllint]
src_dirs = ["yaml"]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# The Makefile converted each yaml/**/*.yaml to out/**/*.json with `yq < in > out`
# (the Python yq, which defaults to JSON output). The generator processor drives
# scripts/yaml_to_json.py, which does the same stdin->stdout redirect since yq
# takes no output-path argument.
[processor.generator.yaml_json]
command = "scripts/yaml_to_json.py"
src_dirs = ["yaml"]
src_extensions = [".yaml"]
output_dir = "out"
output_extension = "json"
batch = false

# The Python yq (a jq wrapper) so CI can run the conversion.
[dependencies]
pip = [
    "yq",
]
